- type: Features
  data:
  - name: Multimodal Understanding
    description: Process and understand text, images, audio, video, and documents
      in a single model.
  - name: Function Calling
    description: Define custom functions that Gemini can invoke to interact with external
      systems and APIs.
  - name: Structured Output
    description: Generate JSON responses conforming to specified schemas for reliable
      data extraction.
  - name: Context Caching
    description: Cache large context windows to reduce latency and cost for repeated
      queries.
  - name: Code Execution
    description: Execute Python code in a sandboxed environment for computational
      tasks.
  - name: Grounding with Google Search
    description: Ground model responses with real-time Google Search results for factual
      accuracy.
  - name: Live Streaming API
    description: Real-time bidirectional voice and video interactions over WebSocket
      connections.
  - name: Image and Video Generation
    description: Generate images and videos from text prompts using Gemini and Veo
      models.
  - name: Text-to-Speech
    description: Native audio generation with multi-speaker support and natural language
      style control.
  - name: Deep Research
    description: Autonomous multi-step research agent that synthesizes cited reports
      from web sources.
  - name: Thinking Mode
    description: Extended reasoning capability for complex problem-solving and analysis
      tasks.
- type: UseCases
  data:
  - name: AI-Powered Chatbots
    description: Build conversational AI assistants with multimodal understanding
      and function calling.
  - name: Document Processing
    description: Extract structured data from documents, PDFs, and images using vision
      capabilities.
  - name: Content Generation
    description: Generate text, images, and video content with AI for marketing and
      creative workflows.
  - name: Code Generation
    description: Generate, explain, and debug code across multiple programming languages.
  - name: Semantic Search
    description: Build search systems using Gemini embeddings for semantic similarity
